<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <title>ECG HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── RESET ──────────────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    /* ── DARK THEME (Default) ───────────────────────── */
    :root {
      --bg:          #090d18;
      --bg-alt:      #0f1624;
      --surface:     #141d2f;
      --surface-alt: #1a2540;
      --border:      rgba(71,130,255,0.14);
      --border-md:   rgba(71,130,255,0.28);
      --accent:      #3b7ff5;
      --accent-dk:   #2563d8;
      --accent-glow: rgba(59,127,245,0.22);
      --text-1:      #dde5f4;
      --text-2:      #7f97c0;
      --text-3:      #445a7a;
      --success:     #22c55e;
      --danger:      #f04040;
      --modal-bg:    #0e1525;
      --inp-bg:      #141d2f;
      --inp-border:  rgba(71,130,255,0.20);
    }

    /* ── LIGHT THEME ────────────────────────────────── */
    body.light {
      --bg:          #f2f6fd;
      --bg-alt:      #e8eef9;
      --surface:     #ffffff;
      --surface-alt: #f5f8fe;
      --border:      rgba(30,80,180,0.10);
      --border-md:   rgba(30,80,180,0.25);
      --accent:      #1a5ce5;
      --accent-dk:   #1246c4;
      --accent-glow: rgba(26,92,229,0.12);
      --text-1:      #0b1628;
      --text-2:      #3d5880;
      --text-3:      #8097b8;
      --success:     #16a34a;
      --danger:      #d92020;
      --modal-bg:    #ffffff;
      --inp-bg:      #f5f8fe;
      --inp-border:  rgba(30,80,180,0.18);
    }

    /* ── BASE ───────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Sora', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
    }

    /* ── HEADER ─────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 60px;
      padding: 0 28px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.4s, border-color 0.4s;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
    }

  .logo-badge {
    width: 36px;
    height: 36px;
    background: var(); 
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.4s;
    }

    .logo-badge svg { width: 30px; height: 30px; }

    .logo-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .logo-sub {
      font-size: 10.5px;
      font-weight: 400;
      color: var(--text-2);
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── HEADER BUTTONS ─────────────────────────────── */
    .h-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .h-btn:hover {
      background: var(--surface);
      color: var(--text-1);
      border-color: var(--border-md);
    }

    .h-btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .h-btn-accent:hover {
      background: var(--accent-dk);
      color: #fff;
      border-color: var(--accent-dk);
    }

    /* ── MAIN AREA ──────────────────────────────────── */
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 26px 24px 60px;
    }

    /* ── STATUS BAR ─────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(34,197,94,0.06);
      border: 1px solid rgba(34,197,94,0.15);
      border-radius: 9px;
      padding: 9px 16px;
      font-size: 11.5px;
      color: var(--text-2);
      margin-bottom: 28px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.20);
    }

    /* ── SECTION LABEL ──────────────────────────────── */
    .sec-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 18px;
    }

    /* ═══════════════════════════════════════════════
       APP GRID — Smartphone Home-Screen Style
    ══════════════════════════════════════════════ */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 22px 10px 16px;
      border-radius: 14px;
      cursor: pointer;
      border: 1px solid white;
      background: transparent;
      transition: background 0.22s, border-color 0.22s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .app-item:hover {
      background: var(--surface, #1246c4);
      border-color: var(--border-md);
    }

    .app-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* iOS-style app icon shell */
    .app-shell {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow:
        0 6px 18px rgba(0,0,0,0.40),
        0 1px 4px  rgba(0,0,0,0.22);
      transition:
        transform 0.25s cubic-bezier(.34,1.56,.64,1),
        box-shadow 0.25s ease;
      background: var(--surface-alt);
      position: relative;
    }

    /* Hover — lift & scale */
    .app-item:hover .app-shell {
      transform: scale(1.19) translateY(-20px);
      box-shadow:
        0 18px 36px rgba(0,0,0,0.42),
        0 4px 12px  var(--accent-glow);
    }

    /* Active / tap — press down */
    .app-item:active .app-shell {
      transform: scale(0.91) translateY(1px);
      box-shadow: 0 2px 8px rgba(236, 233, 233, 0.28);
      transition-duration: 0.08s;
    }

    .app-shell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback tile when PNG is missing */
    .app-fallback {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
      color: rgba(255,255,255,0.92);
      letter-spacing: -0.5px;
    }

    .app-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-1);
      text-align: center;
      line-height: 1.3;
      max-width: 126px;
    }

    /*.app-desc {
      font-size: 10.5px;
      font-weight: 400;
      color: var(--text-2);
      text-align: center;
      line-height: 1.5;
      max-width: 132px;
    }*/

    .app-chip {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 9px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
    }

    /* Launch bounce animation */
    @keyframes appTap {
      0%   { transform: scale(1); }
      30%  { transform: scale(0.86) translateY(2px); }
      65%  { transform: scale(1.14) translateY(-6px); }
      85%  { transform: scale(0.97) translateY(-2px); }
      100% { transform: scale(1)   translateY(0px); }
    }

    .app-shell.bouncing {
      animation: appTap 0.38s cubic-bezier(.22,1,.36,1) forwards;
    }

    /* ═══════════════════════════════════════════════
       ADMIN OVERLAY & MODAL
    ══════════════════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--modal-bg);
      border: 1px solid var(--border-md);
      border-radius: 20px;
      width: 100%;
      max-width: 430px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      transition: background 0.4s;
    }

    /* Scrollbar inside modal */
    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-1);
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text-2);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
      font-family: inherit;
    }

    .modal-close:hover {
      background: var(--surface-alt);
      color: var(--text-1);
      border-color: var(--border-md);
    }

    /* Screens */
    .screen { display: none; }
    .screen.on { display: block; }

    /* Form Elements */
    .f-group { margin-bottom: 14px; }

    .f-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .f-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--inp-bg);
      border: 1px solid var(--inp-border);
      border-radius: 9px;
      color: var(--text-1);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .f-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .f-input-url {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .btn-blue {
      background: var(--accent);
      color: #fff;
    }

    .btn-blue:hover {
      background: var(--accent-dk);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .btn-ghost:hover {
      background: var(--surface-alt);
      color: var(--text-1);
    }

    .btn-red {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(240,64,64,0.25);
    }

    .btn-red:hover {
      background: rgba(240,64,64,0.07);
    }

    /* Feedback messages */
    .f-msg {
      font-size: 11.5px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }

    .f-err { color: var(--danger); }
    .f-ok  { color: var(--success); }

    /* Admin sections */
    .a-section { margin-bottom: 22px; }

    .a-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-1);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .link-row { margin-bottom: 11px; }

    .link-row-label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }

    .btn-row {
      display: flex;
      gap: 9px;
      margin-top: 8px;
    }

    .btn-row .btn { flex: 1; }

    /* ── FOOTER ─────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--text-3);
      border-top: 1px solid var(--border);
    }

    /* ── GLOBAL SCROLLBAR ───────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

<body>

<!-- ══════════════════════════════════════════
     MAIN CONTENT
══════════════════════════════════════════ -->
<main>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span>All systems operational</span>
    <span style="margin-left:auto; opacity:.65">6 applications active</span>
  </div>

  <div class="sec-label">Applications</div>
  <div class="app-grid" id="appGrid"></div>
</main>

<footer>
  © 2026 ECG Application Team &nbsp;·&nbsp; ECG Hub v2.0
</footer>


<!-- ══════════════════════════════════════════
     ADMIN MODAL
══════════════════════════════════════════ -->
<div class="overlay" id="adminOverlay">
  <div class="modal">

    <!-- ─ LOGIN SCREEN ─────────────────────── -->
    <div class="screen on" id="loginScreen">
      <div class="modal-head">
        <span class="modal-title">🔐 Admin Access</span>
        <button class="modal-close" onclick="closeAdmin()" aria-label="Close">✕</button>
      </div>

      <div class="f-group">
        <label class="f-label" for="adminPassInput">Admin Password</label>
        <input class="f-input" type="password" id="adminPassInput"
               placeholder="Enter password"
               onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn btn-blue" onclick="doLogin()">Login</button>
      <button class="btn btn-ghost" onclick="closeAdmin()">Cancel</button>
      <p class="f-msg f-err" id="loginErr"></p>
    </div>

    <!-- ─ ADMIN MANAGEMENT SCREEN ──────────── -->
    <div class="screen" id="adminScreen">
      <div class="modal-head">
        <span class="modal-title">⚙ Admin Panel</span>
        <button class="modal-close" onclick="closeAdmin()" aria-label="Close">✕</button>
      </div>

      <!-- Application Links Section -->
      <div class="a-section">
        <div class="a-section-title">📎 Application Links</div>
        <div id="linksEditor"></div>
        <div class="btn-row">
          <button class="btn btn-blue" onclick="saveLinks()">💾 Save Links</button>
          <button class="btn btn-red"  onclick="doLogout()">Logout</button>
        </div>
        <p class="f-msg f-ok" id="saveOk">✓ Links saved and applied!</p>
      </div>

      <!-- Change Password Section -->
      <div class="a-section">
        <div class="a-section-title">🔑 Change Password</div>
        <div class="f-group">
          <label class="f-label" for="cpCurr">Current Password</label>
          <input class="f-input" type="password" id="cpCurr" placeholder="Current password">
        </div>
        <div class="f-group">
          <label class="f-label" for="cpNew">New Password</label>
          <input class="f-input" type="password" id="cpNew" placeholder="New password (min 6 chars)">
        </div>
        <div class="f-group">
          <label class="f-label" for="cpConf">Confirm New Password</label>
          <input class="f-input" type="password" id="cpConf" placeholder="Re-enter new password">
        </div>
        <button class="btn btn-blue" onclick="changePass()">Update Password</button>
        <p class="f-msg f-err" id="cpErr"></p>
        <p class="f-msg f-ok"  id="cpOk"></p>
      </div>

    </div><!-- /adminScreen -->
  </div><!-- /modal -->
</div><!-- /overlay -->


<!-- ══════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════ -->
<script>

/* ─────────────────────────────────────────────
   APP DEFINITIONS
   Add your PNG filenames in the `icon` field.
   Place the PNG files in the same folder as index.html.
───────────────────────────────────────────── */
const APPS = [
  {
    id: 'stores',
    name: 'ECG LOCKER',
    //desc: 'Materials belongs to application team.',
    icon: 'stores.png',      // ← already exists
    //badge: 'Stores',
    fb: '#2563eb',
    fi: 'IC'
  },
  {
    id: 'ticket',
    name: 'ECG TICKET FORGE',
    //desc: 'Ticket management system for issue tracking, support requests, bug reporting, and service management.',
    icon: 'ticket.png',      // ← add this PNG
    //badge: 'Operations',
    fb: '#7c3aed',
    fi: 'IF'
  },
  {
    id: 'frontline',
    name: 'ECG DISCOVERY',
    //desc: 'Customer requirement capture, opportunity assessment, solution discovery, pre-sales activities, and RFQ/RFP analysis.',
    icon: 'Discovery.png',   // ← add this PNG
    //badge: 'Pre-Sales',
    fb: '#0891b2',
    fi: 'FC'
  },
  {
    id: 'rma',
    name: 'ECG EXECUTION',
    //desc: 'Order execution, acceptance/rejection workflow, delivery tracking, returns, and RMA processing.',
    icon: 'execution.png',         // ← add this PNG
    //badge: 'Service',
    fb: '#dc2626',
    fi: 'RM'
  },
  {
    id: 'nexus',
    name: 'ECG DOCS',
    //desc: 'Central repository for documents, datasheets, manuals, SOPs, technical notes, and knowledge sharing.',
    icon: 'docs.png',       // ← add this PNG
    //badge: 'Resources',
    fb: '#059669',
    fi: 'NK'
  },
  {
    id: 'analytics',
    name: 'ECG MASTER',
    //desc: 'Executive reporting suite with live metrics and cross-platform KPI insights.',
    icon: 'master.png',   // ← add this PNG
    //badge: 'Analytics',
    fb: '#d97706',
    fi: 'CA'
  }
];


/* ─────────────────────────────────────────────
   STORAGE  —  Links & Password
───────────────────────────────────────────── */
// Default credentials — change on first login via Admin Panel.
const _dp = atob('RUNHQDI=') + atob('MDI2');   // see your private note

function getPass() {
  return localStorage.getItem('ecg_pw') || _dp;
}
function storePass(p) {
  localStorage.setItem('ecg_pw', p);
}
function getLinks() {
  try {
    const raw = localStorage.getItem('ecg_links');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const defaults = {};
  APPS.forEach(a => defaults[a.id] = '');
  return defaults;
}
function storeLinks(obj) {
  localStorage.setItem('ecg_links', JSON.stringify(obj));
}


/* ─────────────────────────────────────────────
   RENDER APP GRID
───────────────────────────────────────────── */
function renderGrid() {
  const links = getLinks();
  const grid  = document.getElementById('appGrid');
  grid.innerHTML = '';

  APPS.forEach(app => {
    const url  = links[app.id] || '';

    const item = document.createElement('div');
    item.className = 'app-item';
    item.setAttribute('role', 'button');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-label', 'Open ' + app.name);

    item.innerHTML = `
      <div class="app-shell" id="shell-${app.id}">
        <img
          src="${app.icon}"
          alt="${app.name} icon"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        >
        <div class="app-fallback" style="background:${app.fb}">${app.fi}</div>
      </div>
      <div class="app-name">${app.name}</div>
      
      
    `;

    const launch = () => launchApp(app.id, url);
    item.addEventListener('click', launch);
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); launch(); }
    });

    grid.appendChild(item);
  });
}

function launchApp(id, url) {
  // Bounce animation
  const shell = document.getElementById('shell-' + id);
  if (shell) {
    shell.classList.remove('bouncing');
    void shell.offsetWidth;          // reflow to restart animation
    shell.classList.add('bouncing');
  }
  // Open link after a short delay (so animation is visible)
  if (url && url !== '') {
    setTimeout(() => window.open(url, '_blank'), 190);
  }
}


/* ─────────────────────────────────────────────
   THEME TOGGLE  (with localStorage persistence)
───────────────────────────────────────────── */
let isLight = localStorage.getItem('ecg_theme') === 'light';

function applyTheme() {
  document.body.classList.toggle('light', isLight);
  const btn = document.getElementById('themeBtn');
  btn.innerHTML = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
}

function toggleTheme() {
  isLight = !isLight;
  localStorage.setItem('ecg_theme', isLight ? 'light' : 'dark');
  applyTheme();
}

applyTheme();   // apply on load


/* ─────────────────────────────────────────────
   ADMIN MODAL CONTROL
───────────────────────────────────────────── */
function openAdmin() {
  document.getElementById('adminOverlay').classList.add('open');
  showScreen('loginScreen');
  hideScreen('adminScreen');
  document.getElementById('adminPassInput').value = '';
  hide('loginErr');
}

function closeAdmin() {
  document.getElementById('adminOverlay').classList.remove('open');
}

// Close overlay if clicking outside the modal box
document.getElementById('adminOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeAdmin();
});

// Close with Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAdmin();
});


/* ─────────────────────────────────────────────
   LOGIN
───────────────────────────────────────────── */
function doLogin() {
  const pass = document.getElementById('adminPassInput').value;

  if (!pass) {
    showMsg('loginErr', 'Please enter the admin password.', true);
    return;
  }
  if (pass !== getPass()) {
    showMsg('loginErr', 'Incorrect password. Please try again.', true);
    document.getElementById('adminPassInput').value = '';
    return;
  }

  // Success
  showScreen('adminScreen');
  hideScreen('loginScreen');
  buildLinksEditor();
  clearPassFields();
}

function doLogout() {
  showScreen('loginScreen');
  hideScreen('adminScreen');
  document.getElementById('adminPassInput').value = '';
  hide('loginErr');
}


/* ─────────────────────────────────────────────
   LINKS EDITOR
───────────────────────────────────────────── */
function buildLinksEditor() {
  const links = getLinks();
  const ed    = document.getElementById('linksEditor');
  ed.innerHTML = '';

  APPS.forEach(app => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `
      <span class="link-row-label">${app.name}</span>
      <input
        class="f-input f-input-url"
        type="url"
        id="url-${app.id}"
        value="${links[app.id] || ''}"
        placeholder="https://"
      >
    `;
    ed.appendChild(row);
  });
}

function saveLinks() {
  const obj = {};
  APPS.forEach(a => {
    const el = document.getElementById('url-' + a.id);
    obj[a.id] = el ? el.value.trim() : '';
  });
  storeLinks(obj);
  renderGrid();            // re-render so new links take effect immediately

  const msg = document.getElementById('saveOk');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 2800);
}


/* ─────────────────────────────────────────────
   CHANGE PASSWORD
───────────────────────────────────────────── */
function changePass() {
  const curr = document.getElementById('cpCurr').value;
  const nw   = document.getElementById('cpNew').value;
  const cf   = document.getElementById('cpConf').value;

  hide('cpErr'); hide('cpOk');

  if (!curr || !nw || !cf) {
    showMsg('cpErr', 'All three fields are required.', true); return;
  }
  if (curr !== getPass()) {
    showMsg('cpErr', 'Current password is incorrect.', true); return;
  }
  if (nw.length < 6) {
    showMsg('cpErr', 'New password must be at least 6 characters.', true); return;
  }
  if (nw !== cf) {
    showMsg('cpErr', 'New passwords do not match.', true); return;
  }

  storePass(nw);
  clearPassFields();
  showMsg('cpOk', '✓ Password updated successfully!', false);
}

function clearPassFields() {
  ['cpCurr', 'cpNew', 'cpConf'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  hide('cpErr'); hide('cpOk');
}


/* ─────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────── */
function showScreen(id) { document.getElementById(id).classList.add('on'); }
function hideScreen(id) { document.getElementById(id).classList.remove('on'); }

function showMsg(id, text, isErr) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerText = text;
  el.className = 'f-msg ' + (isErr ? 'f-err' : 'f-ok');
  el.style.display = 'block';
}

function hide(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}


/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
renderGrid();

</script>
